# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
    branches: [main, "phase-*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (vet, staticcheck, test, vuln, licenses, secrets, private)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # betterleaks scans the full history
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: make check

  image:
    name: image (${{ matrix.arch }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm # native arm64: tests the real binary, no emulation
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE: kitchen-grimoire:ci-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          build-args: |
            VERSION=ci-${{ github.sha }}
            REVISION=${{ github.sha }}

      - name: image size under 40 MB (NFR-01)
        run: |
          size=$(docker image inspect "$IMAGE" --format '{{.Size}}')
          echo "image size: $size bytes"
          test "$size" -lt 41943040

      - name: SQLite features in the distroless image (spike S1)
        run: docker run --rm --read-only --tmpfs /tmp "$IMAGE" doctor

      - name: starts with a read-only root filesystem and serves /healthz
        run: |
          docker volume create grimoire-ci-data
          docker run -d --name grimoire --read-only --tmpfs /tmp \
            -v grimoire-ci-data:/data -p 8080:8080 \
            -e GRIMOIRE_BASE_URL=http://localhost:8080 \
            -e GRIMOIRE_TRUSTED_PROXIES=127.0.0.1/32 \
            "$IMAGE"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz; then exit 0; fi
            sleep 1
          done
          docker logs grimoire
          exit 1

      - name: version
        if: always()
        run: docker run --rm "$IMAGE" version --json
