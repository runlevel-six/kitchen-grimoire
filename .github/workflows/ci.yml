# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
    branches: [main, "phase-*"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (vet, staticcheck, test, vuln, licenses, secrets, private)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # betterleaks scans the full history
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: make check

  image:
    name: image (${{ matrix.arch }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm # native arm64: tests the real binary, no emulation
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE: kitchen-grimoire:ci-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          build-args: |
            VERSION=ci-${{ github.sha }}
            REVISION=${{ github.sha }}

      - name: image size under 40 MB (NFR-01)
        run: |
          size=$(docker image inspect "$IMAGE" --format '{{.Size}}')
          echo "image size: $size bytes"
          test "$size" -lt 41943040

      - name: SQLite features in the distroless image (spike S1)
        run: docker run --rm --read-only --tmpfs /tmp "$IMAGE" doctor

      - name: starts with a read-only root, migrates /data, and becomes ready
        run: |
          docker volume create grimoire-ci-data
          docker run -d --name grimoire --read-only --tmpfs /tmp \
            -v grimoire-ci-data:/data -p 8080:8080 \
            -e GRIMOIRE_BASE_URL=http://localhost:8080 \
            -e GRIMOIRE_TRUSTED_PROXIES=127.0.0.1/32 \
            "$IMAGE"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/readyz; then
              curl -fsS http://localhost:8080/healthz
              docker logs grimoire 2>&1 | grep -q '"msg":"applied migration"' || { docker logs grimoire; exit 1; }
              exit 0
            fi
            sleep 1
          done
          docker logs grimoire
          exit 1

      - name: migrate --status against the same volume
        run: |
          docker stop grimoire
          docker run --rm --read-only -v grimoire-ci-data:/data "$IMAGE" migrate --status | tee /dev/stderr | grep -q 'applied'

      - name: version
        if: always()
        run: docker run --rm "$IMAGE" version --json

  publish:
    name: publish image (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The builder stage cross-compiles, so arm64 needs no emulation.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}

  e2e:
    name: e2e (Playwright, iPhone WebKit + iPad Chromium)
    if: github.event_name == 'pull_request'
    needs: check
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps webkit chromium
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
