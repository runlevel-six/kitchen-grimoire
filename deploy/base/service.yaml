# SPDX-License-Identifier: Apache-2.0
apiVersion: v1
kind: Service
metadata:
  name: grimoire
spec:
  selector:
    app.kubernetes.io/name: kitchen-grimoire
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Metrics and the backup stream. No authentication by design: never route an
# Ingress to this Service. The NetworkPolicy admits only the backup job.
apiVersion: v1
kind: Service
metadata:
  name: grimoire-admin
spec:
  selector:
    app.kubernetes.io/name: kitchen-grimoire
    app.kubernetes.io/component: server
  ports:
    - name: admin
      port: 9090
      targetPort: admin
