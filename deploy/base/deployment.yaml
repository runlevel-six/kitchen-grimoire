apiVersion: apps/v1
kind: Deployment
metadata:
  name: grimoire
  labels:
    app.kubernetes.io/name: kitchen-grimoire
    app.kubernetes.io/component: server
spec:
  replicas: 1 # SQLite has one writer; never scale this up
  strategy:
    type: Recreate # the RWO volume can't be attached to two pods at once
  selector:
    matchLabels:
      app.kubernetes.io/name: kitchen-grimoire
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kitchen-grimoire
        app.kubernetes.io/component: server
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532 # makes the new volume writable by the app user
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grimoire
          image: kitchen-grimoire
          args: ["serve"]
          envFrom:
            - configMapRef:
                name: grimoire-config
          env:
            - name: GRIMOIRE_DATA_DIR
              value: /data
          ports:
            - name: http
              containerPort: 8080
            - name: admin
              containerPort: 9090
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 512Mi } # image re-encoding is the peak
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grimoire-data
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi # backup snapshots are written here first
