#
# Placeholder. The overlay sets the class, host, TLS, and the SSO
# forward-auth annotations. Without forward auth in front, every request
# is refused (401): the app trusts identity headers only from the proxy.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grimoire
  annotations:
    # Phone photos are capped at 15 MiB by the app, captured pages at 5 MiB,
    # and admin bundle uploads at 512 MiB; the app enforces each limit.
    nginx.ingress.kubernetes.io/proxy-body-size: 520m
spec:
  rules:
    - host: recipes.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grimoire
                port:
                  name: http
