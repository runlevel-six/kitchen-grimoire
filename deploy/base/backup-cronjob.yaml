# SPDX-License-Identifier: Apache-2.0
# Nightly backup pulled from the admin port (docs/DESIGN.md §14.4).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: grimoire-backup
spec:
  schedule: "27 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: kitchen-grimoire
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: kitchen-grimoire
              args: ["backup-pull", "--from", "http://grimoire-admin:9090", "--out", "/backup", "--keep", "14"]
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { memory: 256Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - { name: backup, mountPath: /backup }
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: grimoire-backup
