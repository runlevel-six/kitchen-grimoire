#
# Kitchen Grimoire with Docker Compose, for people not running Kubernetes.
# Put an SSO reverse proxy (forward auth, e.g. Authelia + Traefik/Caddy) in
# front and set GRIMOIRE_TRUSTED_PROXIES to its address range. Without it,
# every request is refused (401).
#
#   docker compose up -d
#   docker compose run --rm grimoire-backup     # one backup on demand
services:
  grimoire:
    image: ghcr.io/runlevel-six/kitchen-grimoire:latest
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    environment:
      GRIMOIRE_BASE_URL: https://recipes.example.com
      # The proxy's own address, not its whole network: any container that
      # can reach :8080 from a trusted address can claim to be anyone.
      GRIMOIRE_TRUSTED_PROXIES: 172.30.0.10/32
      # The admin port (backups, metrics) has no authentication. Bind it to
      # the internal network's address only, so containers on the shared
      # proxy network can't download the library.
      GRIMOIRE_ADMIN_LISTEN: grimoire-internal:9090
      GRIMOIRE_ADMIN_GROUPS: admins
    volumes:
      - grimoire-data:/data
    hostname: grimoire
    networks:
      proxy: {}
      internal:
        aliases: [grimoire-internal]
    # Port 8080 is the app (route your proxy here); 9090 is metrics and the
    # backup stream and must stay internal.
    expose: ["8080", "9090"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/grimoire", "doctor", "/tmp"]
      interval: 1m

  grimoire-backup:
    image: ghcr.io/runlevel-six/kitchen-grimoire:latest
    profiles: [backup]
    read_only: true
    user: "65532:65532"
    command: ["backup-pull", "--from", "http://grimoire-internal:9090", "--out", "/backup", "--keep", "14"]
    volumes:
      - ./backups:/backup
    networks: [internal]

volumes:
  grimoire-data:

networks:
  # The network your reverse proxy is on. Give the proxy a fixed address
  # on it (here 172.30.0.10) and keep other containers off it if you can.
  proxy:
    external: true
  internal:
